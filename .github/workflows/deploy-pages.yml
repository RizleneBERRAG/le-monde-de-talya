name: Déployer le site sur GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, tokenizer
          coverage: none

      - name: Installer les dépendances PHP
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Préparer Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          {
            echo "APP_ENV=production"
            echo "APP_DEBUG=false"
            echo "APP_URL=https://rizleneberrag.github.io/le-monde-de-talya"
            echo "ASSET_URL=https://rizleneberrag.github.io/le-monde-de-talya"
          } >> .env
          php artisan config:clear

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Construire les styles et scripts
        run: |
          npm ci
          npm run build

      - name: Générer la version statique
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/talya-laravel.log 2>&1 &
          SERVER_PID=$!

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              break
            fi
            sleep 1
          done

          mkdir -p dist
          cp -R public/build dist/build
          cp -R public/images dist/images

          if [ -f public/favicon.ico ]; then
            cp public/favicon.ico dist/favicon.ico
          fi

          curl --fail --show-error http://127.0.0.1:8000/ -o dist/index.html

          for route in la-chatterie nos-maine-coons nos-chatons adoption contact; do
            mkdir -p "dist/$route"
            curl --fail --show-error "http://127.0.0.1:8000/$route" -o "dist/$route/index.html"
          done

          touch dist/.nojekyll
          kill "$SERVER_PID"

      - name: Vérifier les pages générées
        run: |
          test -s dist/index.html
          test -s dist/la-chatterie/index.html
          test -s dist/nos-maine-coons/index.html
          test -s dist/nos-chatons/index.html
          test -s dist/adoption/index.html
          test -s dist/contact/index.html
          test -d dist/build
          test -d dist/images

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Préparer l’archive GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
